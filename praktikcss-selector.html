<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selektor dalam HTML</title>
    <style>
        /* Selektor Tag */
        p {
            color: blue;
        }
        /* Selektor Kelas */
        .highlight {
            background-color:yellow;
        }    
        /* Selektor ID */
        #unique-section {
            border: 2px solid red;
            padding: 10px;
        }
        /* Selektor Atribut */
        a[href] {
            text-decoration: none;
            color:green;
        }
        /* Selektor Universal */
        * {
            font-family: Arial, sans-serif;
        }
</style>
